<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Geography Tab</title>
    <style>
        body {
            background: linear-gradient(43deg ,saddlebrown 0%, darksalmon 46%, sandybrown 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: white;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .username {
            height: 2rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }
        .username2 {
            color: black;
            background-color: white;
            width: 150px;
            height: 34px;
            border-radius: 17px;
            font-style: italic;
            font-size: 1.24rem;
            font-weight: 600;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .username2:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 4px 2px black;
            background-color: #d8d3d3;
        }

        .tabs-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            padding: 20px;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
        }

    </style>
</head>
<body>
<div class="username">
    <div class="username2" id="name"></div>
</div>

<div class="tabs-container">

</div>

<script>
    const saveText = localStorage.getItem('ShardText');
    if (saveText) {
        document.getElementById('name').innerText = saveText;
    }
</script>
</body>
</html>
