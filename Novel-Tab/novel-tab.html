<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Novel Tab</title>
    <style>
        body {
            background: linear-gradient(43deg , #00BFFF 0%, #5CB3FF 46%, #87CEEB 100%) no-repeat;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: white;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .username {
            height: 2rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }
        .username2 {
            color: black;
            background-color: white;
            width: 150px;
            height: 34px;
            border-radius: 17px;
            font-style: italic;
            font-size: 1.24rem;
            font-weight: 600;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .username2:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 4px 2px black;
            background-color: #d8d3d3;
        }

        .tabs-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            padding: 20px;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
        }

        .the-begin {
            display: flex;
            flex-direction: column;
            border: solid black;
            text-align: center;
            background-color: white;
            cursor: pointer;
            border-radius: 16px;
            width: 8rem;
            height: 185px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .the-begin-label {
            color: black;
            font-size: 1.4rem;
            font-weight: 600;
            font-style: oblique;
            display: flex;
            flex-direction: column;
            text-align: center;
            cursor: pointer;
            padding-top: 2px;
        }
        .the-begin-image {
            width: 100%;
            height: 160px;
            cursor: pointer;
            object-fit: cover;}
        .the-begin:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px 12px gray; }
        .the-begin:active {
            background: #474545;}


    </style>
</head>
<body>
<div class="username">
    <div class="username2" id="name"></div>
</div>

<div class="tabs-container">

    <div class="the-begin">
        <a href="the-begin/page1.html" style="text-decoration: none;">
            <label class="the-begin-label">The Begin</label>
            <img src="../images/the-begin.png" alt="The Begin novel" class="the-begin-image">
        </a>
    </div>

    <div>
    </div>
</div>

<script>
    const saveText = localStorage.getItem('ShardText');
    if (saveText) {
        document.getElementById('name').innerText = saveText;
    }
</script>
</body>
</html>
