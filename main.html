<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Writer Novel</title>
    <style>
        body {
            background: linear-gradient(43deg , #c850C0 0%, #bd2a61 46%, #ff4d4d 100%);
            height: 100vh;
            margin: 0;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 600;
            height: 100vh;
        }
        .wrapper2 {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .s-p {
            position: absolute; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 1000;
        }
        .s-t {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
        }
        .s-b {
            width: 100%;
            max-width: 600px;
            height: 46px;
            border-radius: 23px;
            text-align: center;
            border: solid black;
        }
        .s-b:hover {
            box-shadow: 0 8px 12px white;
        }
        .s-b:active {
            background-color: #b3adad;
        }
        .the-begin-p {
            width: 102%;
            max-width: 8rem;
            height: 150px;
            cursor: pointer;
            border-radius: 13px;
        }
        .the-begin-b {
            color: black;
            font-size: 1rem;
            font-weight: 600;
            font-style: oblique;
            display: flex;
            flex-direction: column;
            text-align: left;
            cursor: pointer;
        }

        .the-begin {
            display: flex;
            flex-direction: column;
            position: absolute; top: 7.3rem; left: 2.7rem;
            border: solid black;
            text-align: center;
            background-color: white;
            cursor: pointer;
            border-radius: 16px;
            width: 100%;
            max-width: 8rem;
        }
        .the-begin:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px 12px gray;
        }

        .username {
            display: flex;
            justify-content: right;
            align-items: center;
            flex-direction: column;
            position: absolute;
            top: 1.5rem;
            right: 1rem;
            background-color: white;
            width: 100%;
            max-width: 9rem;
            height: 2.5rem;
            border-radius: 1rem;
            border: 2px solid black;
            color: black;
            box-sizing: border-box;
            text-align: center;
            padding: 7px;
            font-size: 1rem;
            font-weight: 600;
        }
        .username2 {
            display: flex;
            position: absolute;
            font-size: 1rem;
            font-weight: 600;
            top: -1.3rem;
            right: 2rem;
            color: black;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="wrapper2">
        <div class="s-p">
            <label for="search-field" class="s-t">Search</label>
            <input type="search" id="search-field" name="search-field" placeholder="Search bar" class="s-b">
        </div>
        <div class="the-begin" data-model-name="the-begin">
            <a href="the-begin/page1.html" style="text-decoration: none;">
                <img src="images/img.png" alt="The Begin Novel" class="the-begin-p">
                <label class="the-begin-b">The Begin</label>
                <label class="the-begin-b">Writer: None094</label>
            </a>
        </div>
        <div class="username" id="name">
            <label class="username2">Account Tab</label>

        </div>
    </div>
</div>

<script>
    const saveText = localStorage.getItem('ShardText');
    if (saveText) {
        document.getElementById('name').innerText = saveText;
    }
</script>
</body>
</html>
